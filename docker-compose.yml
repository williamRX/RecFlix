version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/home/user/app/src
      - ./data:/home/user/app/data
      - ./models:/home/user/app/models
    environment:
      - ENVIRONMENT=development
    command: uvicorn src.v2_twotower.api.main:app --host 0.0.0.0 --port 8000 --reload

